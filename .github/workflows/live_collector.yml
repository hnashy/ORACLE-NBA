# ORACLE-NBA Path A — sparse live collector
# TEMP (1 week): every 5 min to guarantee T-1h capture (±12 min window).
# Revert to */15 if credits_remaining drops sharply (<450 after ~2 days).
name: live-collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no CSV write, no Telegram send)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests pandas

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/live_collector.py --dry-run

      - name: Live cycle
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/live_collector.py

      - name: Commit master_log if changed
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          if [ -f data/live_collection/master_log.csv ]; then
            git config user.name "oracle-nba-bot"
            git config user.email "bot@oracle-nba.local"
            git add data/live_collection/master_log.csv
            if git diff --staged --quiet; then
              echo "No master_log changes to commit"
            else
              git commit -m "data(live): append odds snapshots [skip ci]"
              git push
            fi
          else
            echo "No master_log.csv yet (no games in window)"
          fi

      - name: Upload master_log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-master-log
          path: data/live_collection/master_log.csv
          if-no-files-found: ignore
          retention-days: 14
