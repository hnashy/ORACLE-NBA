# ORACLE-NBA Path A — sparse live collector
# Runs every 15 minutes. Only writes when a game is inside T-6h / T-1h / T-10m window.
name: live-collector

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no CSV write, no Telegram send)"
        type: boolean
        default: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet requests pandas

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/live_collector.py --dry-run

      - name: Live cycle
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/live_collector.py

      - name: Upload master_log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-master-log
          path: data/live_collection/master_log.csv
          if-no-files-found: ignore
          retention-days: 14
